screen-capture:
  permissions-prompt:
    title: Captura de Tela
    description: Para capturar telas ou janelas, são necessárias permissões de gravação de tela e áudio do sistema.
    open-preferences: Abrir Preferências do Sistema
    dismiss: Dispensar
    instructions:
      step-1: Abra "Preferências do Sistema", selecione "Privacidade e Segurança" na barra lateral.
      step-2: Nas seções "Gravação de Tela e Áudio do Sistema" e "Somente Gravação de Áudio do Sistema", ative os interruptores para AIRI.
      step-2-note: Se AIRI não estiver listada, adicione-a manualmente clicando no botão "+" e selecionando AIRI na pasta Aplicativos.
